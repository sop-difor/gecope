services:
  # Postgres dedicado da Evolution API — a v2 (diferente da v1) EXIGE um banco de verdade
  # mesmo só para guardar estado de instância/sessão; "DATABASE_ENABLED=false" não existe
  # mais como opção que realmente desliga isso (confirmado ao vivo: sem banco, o container
  # entra em loop de crash com "Error: Database provider invalid."). Configurado enxuto
  # (poucas conexões, buffers pequenos) para caber na VM de 1GB, e com os DATABASE_SAVE_*
  # de mensagens/contatos/chats desligados abaixo — só guardamos o necessário para a
  # instância funcionar, não um histórico completo de conversas.
  evolution-postgres:
    image: postgres:15-alpine
    container_name: gecope-evolution-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVO_DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    networks:
      - whatsapp-internal

  # Evolution API — SEM "ports": só acessível pela rede interna, nunca pela internet.
  # Nome da imagem confirmado em 2026-08 (doc.evolution-api.com / repo oficial): o projeto
  # migrou de "atendai/evolution-api" para "evoapicloud/evolution-api" a partir da v2.3.0
  # — o nome antigo não existe mais no Docker Hub. Path de persistência de sessão Baileys
  # confirmado como /evolution/instances (volume evolution_instances abaixo) — sem isso,
  # cada restart do container exige escanear o QR de novo.
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: gecope-evolution-api
    restart: unless-stopped
    environment:
      - AUTHENTICATION_API_KEY=${EVO_API_KEY}
      - AUTHENTICATION_TYPE=apikey
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVO_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - CONFIG_SESSION_PHONE_CLIENT=GECOPE
    depends_on:
      - evolution-postgres
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - whatsapp-internal

  whatsapp-proxy-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gecope-whatsapp-proxy-web
    restart: unless-stopped
    command: ["node", "web/index.js"]
    env_file:
      - .env
    # Sobrescreve de propósito o EVO_API_URL documentado no .env.example: dentro do
    # Docker Compose, o hostname resolvido pela rede interna é sempre o nome do serviço
    # (evolution-api), então esta é a fonte de verdade real — o valor do .env só importa
    # se algum dia este processo rodar fora do compose.
    environment:
      - EVO_API_URL=http://evolution-api:8080
    # Sem "ports": só o Caddy fala com este serviço, pela rede interna. O único ponto de
    # entrada público do stack inteiro é o Caddy (portas 80/443 abaixo).
    depends_on:
      - evolution-api
    networks:
      - whatsapp-internal

  whatsapp-proxy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gecope-whatsapp-proxy-worker
    restart: unless-stopped
    command: ["node", "worker/worker.js"]
    env_file:
      - .env
    environment:
      - EVO_API_URL=http://evolution-api:8080
    # O worker não expõe HTTP nenhum (só faz polling ativo) — o HEALTHCHECK herdado do
    # Dockerfile (que bate em /health na porta 3000) não se aplica aqui, então é desligado.
    healthcheck:
      disable: true
    depends_on:
      - evolution-api
    networks:
      - whatsapp-internal

  # Observa a saúde real da conexão do WhatsApp (não só o estado em cache que a Evolution
  # API reporta) e reinicia o container evolution-api sozinho quando necessário — tanto por
  # pedido manual (botão "Reiniciar Conexão" no painel do GECOPE, aba Administração) quanto
  # automaticamente após degradação sustentada. É o ÚNICO serviço deste stack com acesso ao
  # socket do Docker (equivalente a root na VM); para isso nunca virar risco de segurança:
  # (a) sem "ports" nenhuma — nada aponta tráfego de fora para cá; (b) o Caddy nunca
  # encaminha nada para este serviço; (c) ele só abre conexões PARA FORA (Supabase,
  # Evolution, socket local), nunca aceita conexão de ninguém. Roda como root só porque o
  # socket do Docker já equivale a root de qualquer forma — não amplia o que o acesso ao
  # socket já concede.
  whatsapp-watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gecope-whatsapp-watchdog
    user: root
    restart: unless-stopped
    command: ["node", "watchdog/watchdog.js"]
    env_file:
      - .env
    environment:
      - EVO_API_URL=http://evolution-api:8080
      - EVO_CONTAINER_NAME=gecope-evolution-api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      disable: true
    depends_on:
      - evolution-api
    networks:
      - whatsapp-internal

  # TLS automático (Let's Encrypt, gratuito) na frente do whatsapp-proxy-web — obrigatório:
  # o front-end envia o JWT de sessão do usuário no header Authorization, que não pode
  # trafegar em HTTP puro. Requer DOMAIN apontando (registro DNS tipo A) para o IP público
  # da VM, e as portas 80/443 liberadas no firewall/security group.
  caddy:
    image: caddy:2-alpine
    container_name: gecope-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Só sobe depois que o healthcheck do proxy (definido no Dockerfile, bate em /health)
    # reportar "healthy", evitando o Caddy aceitar tráfego antes do backend estar pronto.
    depends_on:
      whatsapp-proxy-web:
        condition: service_healthy
    networks:
      - whatsapp-internal

networks:
  whatsapp-internal:
    driver: bridge

volumes:
  evolution_instances:
  evolution_store:
  evolution_pgdata:
  caddy_data:
  caddy_config:
